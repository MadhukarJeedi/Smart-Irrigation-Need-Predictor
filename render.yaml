services:
  - type: web
    name: agrosense
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: model.pkl
      - key: PREPROCESSOR_PATH
        value: preprocessor.pkl
